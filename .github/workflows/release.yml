name: Release

# Build and publish the `hirebase` package to PyPI using OpenID Connect
# (Trusted Publishing). No API token is stored as a secret: GitHub mints a
# short-lived OIDC token at runtime that PyPI exchanges for upload rights.
#
# One-time setup on PyPI (https://pypi.org/manage/account/publishing/):
#   Project name:    hirebase
#   Owner:           hirebase-1
#   Repository:      hirebase-cli          # this repo's name
#   Workflow name:   release.yml
#   Environment:     pypi

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    outputs:
      summary: ${{ steps.pytest.outputs.summary }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run tests
        id: pytest
        run: |
          set +e
          set -o pipefail
          pytest -q | tee pytest-output.txt
          code=$?
          SUMMARY="$(grep -E '[0-9]+ passed|[0-9]+ failed' pytest-output.txt | tail -1 | sed -E 's/=+//g' | xargs || true)"
          echo "summary=${SUMMARY:-n/a}" >> "$GITHUB_OUTPUT"
          exit $code

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Extract version
        id: get_version
        run: |
          VERSION=$(grep -m 1 '^version =' pyproject.toml | sed -E 's/.*version = "([^"]+)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Extracted version: $VERSION"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check artifacts
        run: |
          python -m pip install --upgrade twine
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # The dedicated environment lets you add required reviewers / branch
    # restrictions before anything is published.
    environment:
      name: pypi
      url: https://pypi.org/p/hirebase
    permissions:
      # REQUIRED for Trusted Publishing — this is the OIDC token GitHub mints.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI (OIDC Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1

  notify:
    name: Notify Slack
    needs: [test, build, publish]
    if: always()
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.NOTIFICATIONS_WEBHOOK_URL }}
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      COMMIT_MESSAGE: ${{ github.event.head_commit.message || github.event.release.name || github.event.release.tag_name }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      BUILD_RESULT: ${{ needs.test.result == 'success' && needs.build.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') && 'success' || 'failure' }}
      PUBLISH_RESULT: ${{ needs.publish.result }}
      PROJECT_NAME: hirebase
      PACKAGE_VERSION: ${{ needs.build.outputs.version }}
      PACKAGE_URL: https://pypi.org/project/hirebase/${{ needs.build.outputs.version }}/
      TEST_SUMMARY: ${{ needs.test.outputs.summary }}
      BRANCH_NAME: ${{ github.ref_name }}
      ACTOR: ${{ github.actor }}
      FULL_SHA: ${{ github.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
    steps:
      - name: Notify Slack
        run: |
          set +e
          if [[ -z "${SLACK_WEBHOOK_URL}" ]]; then
            echo "NOTIFICATIONS_WEBHOOK_URL secret not set; skipping Slack notify"
            exit 0
          fi

          if [[ "$BUILD_RESULT" == "success" ]]; then
            STATUS="Success"
            EMOJI="✅"
            COLOR="#2eb886"
            GRAPHIC="🟢 CI passed"
          else
            STATUS="Failed"
            EMOJI="❌"
            COLOR="#e01e5a"
            GRAPHIC="🔴 CI failed"
          fi

          case "${GITHUB_EVENT_NAME}" in
            pull_request)
              TRIGGER="Pull request #${PR_NUMBER} → ${PR_BASE_REF}"
              SUMMARY="${PR_TITLE:-n/a}"
              ;;
            push)
              TRIGGER="Push to ${BRANCH_NAME}"
              SUMMARY="$(printf '%s' "${COMMIT_MESSAGE:-}" | head -n1 | cut -c1-120)"
              ;;
            release)
              TRIGGER="Release ${RELEASE_TAG:-published}"
              SUMMARY="$(printf '%s' "${COMMIT_MESSAGE:-}" | head -n1 | cut -c1-120)"
              ;;
            workflow_dispatch)
              TRIGGER="Manual workflow dispatch"
              SUMMARY="$(printf '%s' "${COMMIT_MESSAGE:-}" | head -n1 | cut -c1-120)"
              ;;
            *)
              TRIGGER="${GITHUB_EVENT_NAME}"
              SUMMARY="$(printf '%s' "${COMMIT_MESSAGE:-}" | head -n1 | cut -c1-120)"
              ;;
          esac
          [[ -z "$SUMMARY" ]] && SUMMARY="n/a"

          SHORT_SHA="$(printf '%s' "$FULL_SHA" | cut -c1-8)"
          TITLE="${EMOJI} ${PROJECT_NAME} CI: ${STATUS}"

          fields='[]'
          add_field() {
            local label="$1" value="$2"
            [[ -z "$value" ]] && return
            fields=$(jq -c --arg l "$label" --arg v "$value" \
              '. + [{type:"mrkdwn", text: ("*" + $l + "*\n`" + $v + "`")}]' <<<"$fields")
          }
          add_field "Trigger" "$TRIGGER"
          add_field "Result" "$STATUS"
          add_field "Branch" "${PR_HEAD_REF:-$BRANCH_NAME}"
          add_field "Commit" "$SHORT_SHA"
          add_field "Triggered by" "$ACTOR"
          add_field "Summary" "$SUMMARY"
          add_field "Test job" "${{ needs.test.result }}"
          add_field "Build job" "${{ needs.build.result }}"
          if [[ "${PUBLISH_RESULT:-}" != "skipped" ]]; then
            add_field "Publish job" "${PUBLISH_RESULT:-n/a}"
          fi
          if [[ -n "${TEST_SUMMARY:-}" && "$TEST_SUMMARY" != "n/a" ]]; then add_field "Tests" "$TEST_SUMMARY"; fi
          if [[ -n "${PACKAGE_VERSION:-}" ]]; then add_field "Version" "$PACKAGE_VERSION"; fi
          if [[ "${PUBLISH_RESULT:-}" == "success" ]]; then add_field "PyPI URL" "$PACKAGE_URL"; fi
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" && -n "${PR_URL:-}" ]]; then add_field "PR URL" "$PR_URL"; fi

          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg graphic "$GRAPHIC" \
            --arg color "$COLOR" \
            --argjson fields "$fields" \
            --arg run_url "$RUN_URL" \
            --arg commit_url "$COMMIT_URL" \
            '{
              text: $title,
              attachments: [
                {
                  color: $color,
                  blocks: [
                    { type: "header", text: { type: "plain_text", text: $title, emoji: true } },
                    { type: "section", text: { type: "mrkdwn", text: ("*" + $graphic + "*") } },
                    { type: "section", fields: $fields },
                    {
                      type: "actions",
                      elements: [
                        { type: "button", text: { type: "plain_text", text: "View workflow run", emoji: true }, url: $run_url },
                        { type: "button", text: { type: "plain_text", text: "View commit", emoji: true }, url: $commit_url }
                      ]
                    }
                  ]
                }
              ]
            }')

          curl -sS -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK_URL"
